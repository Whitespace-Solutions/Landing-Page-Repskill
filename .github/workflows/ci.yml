# Cek kualitas di setiap Pull Request & push ke branch selain main.
# Kalau job ini merah, jangan di-merge. deploy.yml juga memanggil workflow ini,
# jadi `main` hanya di-deploy kalau semua cek di sini hijau.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Memastikan image yang benar-benar di-deploy ke Railway (Dockerfile + Caddyfile) bisa dibuild dan jalan.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build the production image
        run: docker build -t repskill-web:ci .

      - name: Run it and check the routes
        run: |
          docker run -d --name site -e PORT=8080 -p 8080:8080 repskill-web:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8080/ && echo "ok / -> 200"
          curl -fsS -o /dev/null http://localhost:8080/pricing/ && echo "ok /pricing/ -> 200"
          # Paths this site does not have must 308 to the same path on the app.
          loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8080/login)
          echo "/login -> $loc"
          [ "$loc" = "308 https://app.repskill.ai/login" ]

      - name: Show container logs on failure
        if: failure()
        run: docker logs site
