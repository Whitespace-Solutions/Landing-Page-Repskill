# Push ke main -> CI hijau -> deploy ke Railway -> cek situs live.
# Setup sekali (lihat README, bagian "Auto deploy"): secret RAILWAY_TOKEN, variable SITE_URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

permissions:
  contents: read

# Hanya satu deploy berjalan; deploy yang sedang jalan tidak dibatalkan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      RAILWAY_SERVICE: landing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.54.1

      # --ci menampilkan log build dan keluar dengan error kalau build gagal. Railway baru memindahkan
      # traffic setelah container baru sehat, jadi rilis yang rusak tidak menggantikan versi lama.
      # Variable NEXT_PUBLIC_* diambil dari variable service di Railway (ditanam saat build).
      - name: Deploy to Railway
        run: railway up --ci --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke-test the live site
        if: vars.SITE_URL != ''
        run: |
          for path in / /pricing/ /about/; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 "${SITE_URL%/}$path"
            echo "ok $path"
          done
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Skipped live smoke test
        if: vars.SITE_URL == ''
        run: echo "::warning::Variable SITE_URL belum diisi, jadi situs live tidak dicek."
