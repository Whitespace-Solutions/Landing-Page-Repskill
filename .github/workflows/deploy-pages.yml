# CADANGAN, hanya manual: build static site -> publish ke GitHub Pages.
# Hosting utama sekarang Railway (lihat deploy.yml). Workflow ini tidak lagi jalan otomatis
# supaya tidak ada dua deploy berebut setiap push ke `main`.
name: Deploy (GitHub Pages, manual)

on:
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy berjalan; deploy yang sedang jalan tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          # "/nama-repo" saat memakai URL <user>.github.io/<repo>; kosong bila memakai custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          # Endpoint penerima formulir Book Demo (Settings → Secrets and variables → Actions → Variables)
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          # Access key Web3Forms (opsional; default ada di src/lib/submit-form.ts)
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          # Alamat login aplikasi Repskill untuk menu "Log in" di header
          NEXT_PUBLIC_LOGIN_URL: ${{ vars.LOGIN_URL }}
          # Endpoint harga live dari aplikasi Repskill (opsional; default https://app.repskill.ai/api/public/pricing)
          NEXT_PUBLIC_PRICING_API_URL: ${{ vars.PRICING_API_URL }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
