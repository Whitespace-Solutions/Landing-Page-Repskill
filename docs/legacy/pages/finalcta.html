<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:#3B494C;position:relative;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div style="position:absolute;right:-60px;top:-40px;bottom:-40px;width:420px;pointer-events:none" aria-hidden="true">
    <div style="position:absolute;right:220px;top:0;bottom:0;width:56px;background:#FF6D00;transform:skewX(-38deg);opacity:0.9"></div>
    <div style="position:absolute;right:110px;top:0;bottom:0;width:56px;background:#49B8D1;transform:skewX(-38deg);opacity:0.35"></div>
    <div style="position:absolute;right:0;top:0;bottom:0;width:56px;background:#49B8D1;transform:skewX(-38deg);opacity:0.15"></div>
  </div>
  <div style="position:relative;max-width:1366px;margin:0 auto;padding:clamp(72px,10vw,120px) clamp(20px,4.5vw,64px)">
    <div style="max-width:720px;display:flex;flex-direction:column;gap:20px;align-items:flex-start">
      <h2 style="margin:0;font-size:clamp(28px,3vw,36px);line-height:1.12;font-weight:700;letter-spacing:-0.02em;color:#FFFFFF;text-wrap:balance">{{ title }}</h2>
      <p style="margin:0;font-size:18px;line-height:1.6;color:#E8EAEB;text-wrap:pretty">{{ body }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:12px">
        <a href="{{ href }}" style="display:inline-flex;align-items:center;gap:10px;background:#FF6D00;color:#FFFFFF;font-size:16px;font-weight:600;padding:16px 26px;border-radius:10px" style-hover="background:#E86300;color:#FFFFFF" style-active="transform:translateY(1px)">{{ cta }}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Make Your Sales Expertise Scalable.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;See how Repskill can help turn your organization's expertise into capability your whole sales team can build.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Request Demo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Request Demo.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      title: this.props.title ?? 'Make Your Sales Expertise Scalable.',
      body: this.props.body ?? "See how Repskill can help turn your organization's expertise into capability your whole sales team can build.",
      cta: this.props.cta ?? 'Request Demo',
      href: this.props.href ?? 'Request Demo.dc.html',
    };
  }
}
</script>
</body>
</html>
